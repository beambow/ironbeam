<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helm Iron Man 3D</title>
<style>
:root{--cyan:#7df3ff;--gold:#e0a526;--red:#b3121b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--cyan);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#stage{position:absolute;transform:scaleX(-1)}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#stage video{filter:brightness(.8) contrast(1.1)}
#tint{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 40%,rgba(0,20,40,.7) 100%)}
#scan{position:fixed;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 14px var(--cyan);opacity:0;pointer-events:none}
body.hud #scan{opacity:.85;animation:scan 3s linear infinite}
@keyframes scan{to{top:100%}}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,10,20,.92));text-align:center}
#status{font-size:12px;opacity:.7;min-height:1.3em}
#heard{min-height:1.5em;font-size:15px;letter-spacing:.04em;margin:2px 0 8px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{background:rgba(125,243,255,.1);color:var(--cyan);border:1px solid var(--cyan);border-radius:999px;padding:9px 14px;font-size:13px}
button:active{background:rgba(125,243,255,.35)}
#start{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle,#1b0507,#000);text-align:center;padding:24px}
#start h1{margin:0;font-size:26px;letter-spacing:.2em;color:var(--gold)}
#start p{margin:0;max-width:330px;font-size:14px;opacity:.8;line-height:1.5}
#go{font-size:17px;padding:14px 34px;background:var(--red);color:#fff;border-color:var(--gold)}
#err{color:#ff8a8a;font-size:13px;max-width:320px}
</style>
</head>
<body>
<div id="stage"><video id="cam" playsinline muted autoplay></video><canvas id="gl"></canvas></div>
<div id="tint"></div><div id="scan"></div>
<div id="bar">
 <div id="status"></div>
 <div id="heard">…</div>
 <div class="btns">
  <button data-c="buka">Buka</button><button data-c="tutup">Tutup</button>
  <button data-c="nyala">Mata ON</button><button data-c="mati">Mata OFF</button>
  <button data-c="tembak">Tembak</button><button data-c="hud">HUD</button>
 </div>
</div>
<div id="start">
 <h1>JARVIS 3D</h1>
 <p>Helm Iron Man 3D mengikuti wajahmu lewat kamera depan. Perintah suara: "buka", "tutup", "mata nyala", "mata mati", "tembak", "hud".</p>
 <button id="go">Aktifkan</button>
 <div id="err"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
const T=THREE,B=document.body,$=id=>document.getElementById(id);
const VISION='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const stage=$('stage'),video=$('cam'),status=$('status'),heard=$('heard');

/* ---------- Scene ---------- */
const renderer=new T.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene(),cam=new T.PerspectiveCamera(63,3/4,1,1000);
scene.add(new T.HemisphereLight(0xffffff,0x334466,1.15));
const dl=new T.DirectionalLight(0xffffff,.9);dl.position.set(0,20,30);scene.add(dl);

const head=new T.Group();head.matrixAutoUpdate=false;head.visible=false;scene.add(head);
/* KALIBRASI: geser angka ini kalau helm kurang pas di wajahmu (satuan cm) */
const C=[0,1.5,-4];                 // pusat kepala
const pv=new T.Group();pv.position.set(0,9,-4);head.add(pv); // engsel penutup wajah
const put=(m,x,y,z)=>{m.position.set(x,y-9,z+4);pv.add(m);return m};
const mk=(g,mat,r,p,parent)=>{const m=new T.Mesh(g,mat);m.scale.set(...r);m.position.set(...p);(parent||head).add(m);return m};

// penghalang kedalaman (tak terlihat) supaya bagian dalam helm tidak menutupi wajah
const occ=mk(new T.SphereGeometry(1,24,16),new T.MeshBasicMaterial({colorWrite:false}),[7.6,10,8],[0,1,-3]);occ.renderOrder=-1;
// cangkang merah (depan terbuka)
mk(new T.SphereGeometry(1,40,30,Math.PI/2+1,Math.PI*2-2),new T.MeshPhongMaterial({color:0xb3121b,shininess:90,side:T.DoubleSide}),[9.6,11.8,10.6],C);
// penutup wajah emas
const gold=new T.MeshPhongMaterial({color:0xe0a526,shininess:120,side:T.DoubleSide});
put(new T.Mesh(new T.SphereGeometry(1,40,30,Math.PI/2-1,2,.08*Math.PI,.92*Math.PI),gold),...C).scale.set(10,12.2,11.2);
// mata
const eyeMat=new T.MeshBasicMaterial({color:0xcffcff}),eyes=[];
[-1,1].forEach(s=>{const e=put(new T.Mesh(new T.BoxGeometry(3,.9,.9),eyeMat),s*3.6,3.2,6.5);e.rotation.y=s*.38;e.rotation.z=s*.22;eyes.push(e)});
// kisi mulut
const dark=new T.MeshPhongMaterial({color:0x5a3a05});
[[-5.5,5.3],[-6.8,4.3],[-8.1,3]].forEach(([y,z])=>put(new T.Mesh(new T.BoxGeometry(5,.35,.6),dark),0,y,z));
// sinar tembak
const beams=[-1,1].map(s=>{const b=new T.Mesh(new T.BoxGeometry(.8,.8,60),new T.MeshBasicMaterial({color:0x9ff6ff}));b.position.set(s*3.6,3.2,37);b.visible=false;head.add(b);return b});

/* ---------- Ukuran mengikuti video ---------- */
function layout(){
 const vw=video.videoWidth||3,vh=video.videoHeight||4;
 const k=Math.max(innerWidth/vw,innerHeight/vh),w=vw*k,h=vh*k;
 Object.assign(stage.style,{width:w+'px',height:h+'px',left:(innerWidth-w)/2+'px',top:(innerHeight-h)/2+'px'});
 renderer.setSize(w,h,false);cam.aspect=vw/vh;cam.updateProjectionMatrix();
}
addEventListener('resize',layout);video.addEventListener('loadedmetadata',layout);layout();

/* ---------- Pelacak wajah ---------- */
let landmarker=null,lastT=-1,open=false;
async function loadTracker(){
 try{
  status.textContent='Memuat pelacak wajah…';
  const {FaceLandmarker,FilesetResolver}=await import(VISION+'/vision_bundle.mjs');
  const fs=await FilesetResolver.forVisionTasks(VISION+'/wasm');
  landmarker=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFacialTransformationMatrixes:true});
  status.textContent='Pelacakan wajah aktif';
 }catch(e){status.textContent='Pelacak wajah gagal dimuat (butuh internet & halaman HTTPS). Mode demo.';landmarker=null}
}
function loop(){
 requestAnimationFrame(loop);
 if(landmarker){
  if(video.readyState>=2&&video.currentTime!==lastT){
   lastT=video.currentTime;
   const r=landmarker.detectForVideo(video,performance.now());
   const m=r.facialTransformationMatrixes&&r.facialTransformationMatrixes[0];
   if(m){head.matrix.fromArray(m.data);head.visible=true}else head.visible=false;
  }
 }else{
  head.matrix.makeRotationY(Math.sin(performance.now()/900)*.3).setPosition(0,-1,-45);head.visible=true;
 }
 pv.rotation.x+=((open?-1.45:0)-pv.rotation.x)*.12;
 renderer.render(scene,cam);
}
loop();

/* ---------- Suara ---------- */
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function act(c){
 c=(c||'').toLowerCase();
 if(/tutup|pasang|turun/.test(c)){open=false;say('Helm terpasang')}
 else if(/buka|naik|lepas/.test(c)){open=true;say('Helm terbuka')}
 else if(/mata\s*(mati|padam)|matikan|^mati$/.test(c)){eyeMat.color.set(0x222a2c);say('Mata dimatikan')}
 else if(/nyala|hidup|aktif/.test(c)){eyeMat.color.set(0xcffcff);say('Mata menyala')}
 else if(/tembak|repulsor|api|serang/.test(c)){beams.forEach(b=>b.visible=true);say('Repulsor aktif');setTimeout(()=>beams.forEach(b=>b.visible=false),450)}
 else if(/hud|scan|pindai|radar/.test(c)){B.classList.toggle('hud');say(B.classList.contains('hud')?'Pemindaian aktif':'Pemindaian nonaktif')}
 else if(/jarvis|halo|hai/.test(c)){say('Siap, bos')}
}
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>act(b.dataset.c));
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){heard.textContent='Suara tidak didukung di browser ini. Pakai tombol.';return}
 const r=new SR();r.lang='id-ID';r.continuous=true;r.interimResults=true;
 r.onresult=e=>{const last=e.results[e.results.length-1],t=last[0].transcript;heard.textContent=last.isFinal?'"'+t.trim()+'"':t;if(last.isFinal)act(t)};
 r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')heard.textContent='Izin mikrofon ditolak. Pakai tombol.'};
 r.onend=()=>{try{r.start()}catch(e){}};
 try{r.start();heard.textContent='Mendengarkan…'}catch(e){}
}

/* ---------- Mulai ---------- */
$('go').onclick=async()=>{
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=s;await video.play();layout();
 }catch(e){$('err').textContent='Kamera tidak bisa dibuka ('+(e.name||'error')+'). Pastikan halaman HTTPS dan izin kamera diberikan.';return}
 $('start').style.display='none';
 startVoice();say('Sistem aktif');
 loadTracker();
};
</script>
</body>
</html>
